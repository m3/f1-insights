name: Deploy F1 Insights to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install Python Dependencies & Run Tests
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio requests
          PYTHONPATH=. python data_pipeline/main.py
          python -m pytest -v

      - name: Install Frontend Dependencies & Build React Bundle
        working-directory: ./portal
        run: |
          npm ci
          npm run build
          mkdir -p dist/data
          cp -r public/data/* dist/data/

      - name: Install SSH Private Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.M3_VPS_SSH_KEY }}
          known_hosts: 'placeholder'
          if_key_exists: replace

      - name: Add VPS Host Fingerprint to Known Hosts
        run: |
          ssh-keyscan -p 2222 -H 91.99.167.113 >> ~/.ssh/known_hosts || true

      - name: Rsync Artifact to VPS
        run: |
          ssh -p 2222 mathias@91.99.167.113 "mkdir -p /var/www/f1-insights/portal /var/www/f1-insights/backend /var/www/f1-insights/data_pipeline /var/www/f1-insights/mcp_server /var/www/f1-insights/public"
          rsync -avz -e "ssh -p 2222" --delete portal/dist/ mathias@91.99.167.113:/var/www/f1-insights/portal/dist/
          rsync -avz -e "ssh -p 2222" portal/public/ mathias@91.99.167.113:/var/www/f1-insights/portal/public/
          rsync -avz -e "ssh -p 2222" public/ mathias@91.99.167.113:/var/www/f1-insights/public/
          rsync -avz -e "ssh -p 2222" --exclude '__pycache__' --exclude '*.pyc' backend/ mathias@91.99.167.113:/var/www/f1-insights/backend/
          rsync -avz -e "ssh -p 2222" --exclude '__pycache__' --exclude '*.pyc' data_pipeline/ mathias@91.99.167.113:/var/www/f1-insights/data_pipeline/
          rsync -avz -e "ssh -p 2222" --exclude '__pycache__' --exclude '*.pyc' mcp_server/ mathias@91.99.167.113:/var/www/f1-insights/mcp_server/

      - name: Restart PM2 & Verify Health on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '91.99.167.113'
          port: 2222
          username: 'mathias'
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.M3_VPS_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            # Purge pyc bytecode cache
            find /var/www/f1-insights -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find /var/www/f1-insights -name "*.pyc" -delete 2>/dev/null || true

            cd /var/www/f1-insights/backend
            source venv/bin/activate || (python3 -m venv venv && source venv/bin/activate)
            pip install -r requirements.txt
            
            # Execute pipeline refresh on VPS using venv python with explicit PYTHONPATH
            cd /var/www/f1-insights

            # Clone or pull TracingInsights data repo
            if [ -d "data/tracing-insights/.git" ]; then
              cd data/tracing-insights && git pull --ff-only && cd ../..
            else
              mkdir -p data
              git clone --depth 1 https://github.com/TracingInsights/2026.git data/tracing-insights
            fi

            PYTHONPATH=. /var/www/f1-insights/backend/venv/bin/python data_pipeline/main.py full
            mkdir -p /var/www/f1-insights/portal/dist/data /var/www/f1-insights/public/data
            cp -r /var/www/f1-insights/portal/public/data/* /var/www/f1-insights/portal/dist/data/
            cp -r /var/www/f1-insights/portal/public/data/* /var/www/f1-insights/public/data/

            # Copy dist bundle directly to Nginx document roots with sudo
            sudo mkdir -p /var/www/f1.sports.superchargedbym3.com 2>/dev/null || true
            sudo cp -r /var/www/f1-insights/portal/dist/* /var/www/f1.sports.superchargedbym3.com/ 2>/dev/null || true
            sudo chown -R mathias:www-data /var/www/f1-insights /var/www/f1.sports.superchargedbym3.com 2>/dev/null || true

            # Force kill PM2 static server process to force reload of fresh React JS assets
            pm2 delete f1-insights-portal || true
            pm2 delete f1-insights-backend || true
            pm2 start "npx serve -s /var/www/f1-insights/portal/dist -l 3010" --name "f1-insights-portal"
            pm2 start "/var/www/f1-insights/backend/venv/bin/python -m uvicorn app.main:app --port 8000" --name "f1-insights-backend" --cwd "/var/www/f1-insights/backend"
            
            # Flush Nginx cache
            sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || true

            # Verify HTTP health with retry
            sleep 6
            curl -f http://127.0.0.1:8000/api/v1/health || (sleep 4 && curl -f http://127.0.0.1:8000/api/v1/health) || exit 1

name: Deploy F1 Insights to Production VPS

# CI-builds-the-artifact pattern per M3-Conventions §3.
# The VPS never runs build steps — GitHub Actions builds the React production
# assets and tests in CI, rsyncs the clean tree to the VPS, and restarts PM2.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-f1-insights
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Artifact in CI + Rsync to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install Python Dependencies & Run Tests
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio
          python -m pytest -v

      - name: Install Frontend Dependencies & Build React Bundle
        working-directory: ./portal
        run: |
          npm ci
          npm run build

      - name: Install SSH Private Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.M3_VPS_SSH_KEY }}
          known_hosts: 'placeholder'
          if_key_exists: replace

      - name: Add VPS Host Fingerprint to Known Hosts
        run: |
          mkdir -p ~/.ssh
          TARGET_HOST="${{ secrets.VPS_HOST || '91.99.167.113' }}"
          TARGET_PORT="${{ secrets.VPS_PORT || '2222' }}"
          ssh-keyscan -p "${TARGET_PORT}" -H "${TARGET_HOST}" >> ~/.ssh/known_hosts || true

      - name: Rsync Artifact to VPS
        run: |
          TARGET_HOST="${{ secrets.VPS_HOST || '91.99.167.113' }}"
          TARGET_USER="${{ secrets.VPS_USER || 'mathias' }}"
          TARGET_PORT="${{ secrets.VPS_PORT || '2222' }}"
          TARGET_PATH="${{ secrets.VPS_PROJECT_PATH || '/var/www/f1-insights/' }}"
          
          rsync -e "ssh -p ${TARGET_PORT} -o StrictHostKeyChecking=no" -rlgoDzvO --delete \
            --exclude=.venv \
            --exclude=backend/data \
            --exclude=*.db \
            --exclude=*.db-shm \
            --exclude=*.db-wal \
            --exclude=logs \
            --exclude=*.log \
            --exclude=portal/node_modules \
            --exclude=.env \
            --exclude=.env.* \
            ./ "${TARGET_USER}@${TARGET_HOST}:${TARGET_PATH}"

      - name: Restart PM2 & Verify Health on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '91.99.167.113' }}
          username: ${{ secrets.VPS_USER || 'mathias' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.M3_VPS_SSH_KEY }}
          port: 2222
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH || '/var/www/f1-insights' }}
            git reset --hard
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            .venv/bin/pip install -r backend/requirements.txt -q
            .venv/bin/python data_pipeline/main.py
            pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save
            sleep 3
            online=$(pm2 jlist | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for p in d if p['name'] in ('f1-insights-portal','f1-insights-backend') and p['pm2_env']['status']=='online'))")
            if [ "$online" -ge "2" ]; then
              echo "✅ f1-insights portal and backend services online"
            else
              echo "❌ f1-insights unhealthy (online=$online)" >&2
              pm2 list | grep f1-insights || true
              exit 1
            fi

name: TracingInsights Data Sync

on:
  schedule:
    # Every 15 minutes during race weekends (Fri-Sun), every 2 hours otherwise
    - cron: '*/15 * * * 5,6,0'  # Every 15 min Fri-Sun (5=Fri, 6=Sat, 0=Sun)
    - cron: '0 */2 * * 1-4'     # Every 2 hours Mon-Thu
  workflow_dispatch:

jobs:
  sync-tracing-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check TracingInsights for New Commits
        id: check
        run: |
          # Get latest commit SHA from TracingInsights/2026
          LATEST_SHA=$(curl -s "https://api.github.com/repos/TracingInsights/2026/commits?per_page=1" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['sha'])" 2>/dev/null || echo "")
          echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT

          # Read last known SHA
          LAST_SHA=""
          if [ -f ".tracing-insights-sha" ]; then
            LAST_SHA=$(cat .tracing-insights-sha)
          fi
          echo "last_sha=$LAST_SHA" >> $GITHUB_OUTPUT

          if [ "$LATEST_SHA" != "$LAST_SHA" ] && [ -n "$LATEST_SHA" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔔 TracingInsights updated: $LAST_SHA -> $LATEST_SHA"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ TracingInsights unchanged at $LATEST_SHA"
          fi

      - name: Clone TracingInsights Data
        if: steps.check.outputs.changed == 'true'
        run: |
          git clone --depth 1 https://github.com/TracingInsights/2026.git data/tracing-insights

      - name: Set up Python 3.11
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies & Run Pipeline
        if: steps.check.outputs.changed == 'true'
        run: |
          pip install -r backend/requirements.txt
          PYTHONPATH=. python data_pipeline/main.py full

      - name: Install SSH Private Key
        if: steps.check.outputs.changed == 'true'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.M3_VPS_SSH_KEY }}
          known_hosts: 'placeholder'
          if_key_exists: replace

      - name: Add VPS Host Fingerprint
        if: steps.check.outputs.changed == 'true'
        run: ssh-keyscan -p 2222 -H 91.99.167.113 >> ~/.ssh/known_hosts || true

      - name: Sync Data to VPS & Restart
        if: steps.check.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '91.99.167.113'
          port: 2222
          username: 'mathias'
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.M3_VPS_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            cd /home/mathias/f1-insights

            # Clone or pull TracingInsights data
            if [ -d "data/tracing-insights/.git" ]; then
              cd data/tracing-insights && git pull --ff-only && cd ../..
            else
              mkdir -p data
              git clone --depth 1 https://github.com/TracingInsights/2026.git data/tracing-insights
            fi

            # Run pipeline with fresh data
            source backend/venv/bin/activate || (python3 -m venv backend/venv && source backend/venv/bin/activate)
            PYTHONPATH=. python data_pipeline/main.py full

            # Copy generated data to dist
            cp -r portal/public/data/* portal/dist/data/ 2>/dev/null || true

            # Restart PM2 processes
            pm2 restart f1-insights-portal || true
            pm2 restart f1-insights-backend || true
            sudo systemctl reload nginx 2>/dev/null || true

      - name: Save Latest SHA
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.check.outputs.latest_sha }}" > .tracing-insights-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .tracing-insights-sha
          git commit -m "chore: update TracingInsights SHA to ${{ steps.check.outputs.latest_sha }}" || true
          git push || true

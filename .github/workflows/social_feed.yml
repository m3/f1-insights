name: F1 Social & Media Feed Refresh

on:
  schedule:
    # Run X & YouTube social feed refresh every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  refresh-social-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Fast Social Feed Update
        run: |
          python data_pipeline/main.py social

      - name: Commit and Push Updated Social Feeds
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add portal/public/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: refresh high-frequency social & media feed [skip ci]"
          git pull --rebase origin main || true
          git push

name: F1 Insights Brief Generator

on:
  schedule:
    # Run Pre-Race Brief every Friday at 08:00 UTC
    - cron: '0 8 * * 5'
    # Run Post-Race Debrief every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install -r backend/requirements.txt || pip install requests

      - name: Run F1 Data Analytics Pipeline
        run: |
          python data_pipeline/main.py full

      - name: Commit and Push Updated Data Briefs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add portal/public/data/ public/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update latest F1 race briefs & telemetry [skip ci]"
          git push

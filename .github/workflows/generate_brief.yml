name: F1 Insights Brief Generator & Session Watcher

on:
  schedule:
    # Run session watcher every 30 minutes to evaluate race weekend triggers:
    # 1. Post-Race Debrief: Race End + 45 min
    # 2. Pre-Race Preview: Before FP1 & 45 min after FP1/FP2/FP3/Sprint/Qualifying
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run F1 Data Analytics Pipeline & Session Watcher
        run: |
          PYTHONPATH=. python data_pipeline/main.py full

      - name: Commit and Push Updated Data Briefs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add portal/public/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update F1 race briefs & session checkpoints [skip ci]"
          git pull --rebase --autostash origin main || true
          git push

# Rate Limiting Zone: Allow 30 requests/minute per IP with a burst allowance of 20
limit_req_zone $binary_remote_addr zone=f1_limit:10m rate=30r/m;

# Nginx Virtual Host Configuration for f1.sports.superchargedbym3.com
server {
    listen 80;
    listen [::]:80;
    server_name f1.sports.superchargedbym3.com;

    # Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name f1.sports.superchargedbym3.com;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/f1.sports.superchargedbym3.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/f1.sports.superchargedbym3.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip & Security Headers (WCAG & OWASP Strict Security Profile)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:;" always;

    # Enforce Rate Limit Zone
    limit_req zone=f1_limit burst=20 nodelay;

    # Frontend Static UI (React Vite SPA - Port 3010)
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend FastAPI REST Endpoints (Port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
